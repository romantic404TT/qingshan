[workspace]
# 独立的 workspace root：本项目不被上游任何仓库收养，青简 Core 到 3.4 才以 path 依赖接入。

[package]
name = "qingshan-engine"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "青杉输入法 JNI 适配层：冒充水杉的 libmsime_android.so，把 NativeClient 的 102 个 native 方法接到青简 Core 上"

[lib]
# name 决定产物名：cdylib 出 libmsime_android.so。
# 这个名字不能改——NativeClient.java:36 硬编码 System.loadLibrary("msime_android")。
# rlib 让 host 侧 cargo test 能 link 进来做 JSON 契约断言。
name = "msime_android"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
# 刻意不引入 qingjian-platform（→qingjian-predict→async-openai→native-tls→openssl-sys）
# 和 qingjian-render（cosmic-text/tiny-skia/resvg，候选栏由 Kotlin View 画，不需要）。
jni = "0.22.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

# 3.4：青简 Core 六件套，path 依赖指向上游工作区的成员 crate。
# 这六个的闭包实测只有 ferrous-opencc / foldhash / jiff / memmap2 / serde / serde_json /
# thiserror / tracing / zerocopy / toml，全是纯 Rust，零 openssl、零网络、零平台 API。
# 上游用 workspace 继承（edition.workspace 等），cargo 会顺着目录找到
# projects/qingjian/Cargo.toml 去解析，不需要把本项目挂进那个 workspace。
qingjian-core = { path = "../../qingjian/crates/qingjian-core" }
qingjian-dictionary = { path = "../../qingjian/crates/qingjian-dictionary" }
qingjian-format = { path = "../../qingjian/crates/qingjian-format" }
qingjian-learning = { path = "../../qingjian/crates/qingjian-learning" }
qingjian-lm = { path = "../../qingjian/crates/qingjian-lm" }
qingjian-translate = { path = "../../qingjian/crates/qingjian-translate" }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
# 必须是 unwind：PRD 风险表要求 FFI 边界用 catch_unwind 把 panic 转成错误码返回，
# 而不是让输入法进程崩掉。设成 abort 会让 catch_unwind 失效。
panic = "unwind"
